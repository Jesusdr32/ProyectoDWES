<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head(${title})}"></head>

<body>
<div th:replace="~{fragments/header :: preloader}"></div>

<div th:replace="~{fragments/header :: header}"></div>

<div th:replace="~{fragments/header :: breadcumb(${subtitulo}, ${titulo})}"></div>

<div class="container mt-5 mb-5">

  <div class="row">
    <div class="col-lg-10 offset-lg-1">

      <!-- Título -->
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Buscador de productos</h1>
      </div>

      <!-- FORMULARIO -->
      <form method="get" th:action="@{/products/search}" class="card p-4 mb-4 shadow-sm">
        <div class="row g-3">

          <!-- Texto -->
          <div class="col-md-6">
            <label for="text" class="form-label">Nombre o descripción</label>
            <input type="text" id="text" name="text" class="form-control"
                   th:value="${text}" placeholder="Buscar..."/>
          </div>

          <!-- Precio -->
          <div class="col-md-3">
            <label for="maxPrice" class="form-label">Precio máximo (€)</label>
            <input type="number" id="maxPrice" name="maxPrice"
                   class="form-control" step="0.01" min="0"
                   th:value="${maxPrice}"/>
          </div>

          <!-- Marca -->
          <div class="col-md-3">
            <label for="brandId" class="form-label">Marca</label>
            <select id="brandId" name="brandId" class="form-select">
              <option value="">-- Todas --</option>
              <option th:each="b : ${brands}"
                      th:value="${b.id}"
                      th:text="${b.name}"
                      th:selected="${b.id == brandId}">
              </option>
            </select>
          </div>

          <!-- Categoría -->
          <div class="col-md-3">
            <label for="categoryId" class="form-label">Categoría</label>
            <select id="categoryId" name="categoryId" class="form-select">
              <option value="">-- Todas --</option>
              <option th:each="c : ${categories}"
                      th:value="${c.id}"
                      th:text="${c.name}"
                      th:selected="${c.id == categoryId}">
              </option>
            </select>
          </div>

          <!-- Tamaño página -->
          <div class="col-md-2">
            <label for="size" class="form-label">Por página</label>
            <select id="size" name="size" class="form-select">
              <option th:each="s : ${pageSizes}"
                      th:value="${s}"
                      th:text="${s}"
                      th:selected="${s == size}">
              </option>
            </select>
          </div>

          <!-- Ordenación -->
          <div class="col-md-4">
            <label for="sortBy" class="form-label">Ordenar por</label>
            <select id="sortBy" name="sortBy" class="form-select">
              <option th:each="opt : ${sortOptions}"
                      th:value="${opt.value()}"
                      th:text="${opt.text()}"
                      th:selected="${opt.value() == sortBy}">
              </option>
            </select>
          </div>

          <!-- Reset página -->
          <input type="hidden" name="page" value="0"/>

        </div>

        <div class="mt-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Buscar</button>
          <a th:href="@{/products/search}" class="btn btn-outline-secondary">Limpiar</a>
        </div>
      </form>

      <!-- RESULTADOS -->
      <div th:if="${results != null}">

        <p class="text-muted">
          Total páginas:
          <strong th:text="${totalPages}"></strong>
        </p>

        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle shadow-sm">
            <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Marca</th>
              <th>Precio</th>
              <th>Stock</th>
            </tr>
            </thead>
            <tbody>

            <tr th:if="${#lists.isEmpty(results)}">
              <td colspan="5" class="text-center text-muted">
                No se encontraron productos.
              </td>
            </tr>

            <tr th:each="p : ${results}">
              <td th:text="${p.id}"></td>
              <td th:text="${p.name}"></td>
              <td th:text="${p.brand.name}"></td>
              <td th:text="${#numbers.formatDecimal(p.price,1,2)} + ' €'"></td>
              <td>
                                <span class="badge"
                                      th:text="${p.stock}"
                                      th:classappend="${p.stock > 10} ? 'bg-success' :
                                                     (${p.stock > 0} ? 'bg-warning text-dark' : 'bg-danger')">
                                </span>
              </td>
            </tr>

            </tbody>
          </table>
        </div>

        <!-- PAGINACIÓN -->
        <nav th:if="${totalPages > 1}">
          <ul class="pagination justify-content-center">

            <!-- Anterior -->
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
              <a class="page-link"
                 th:href="@{/products/search(
                                text=${text},
                                maxPrice=${maxPrice},
                                brandId=${brandId},
                                categoryId=${categoryId},
                                size=${size},
                                sortBy=${sortBy},
                                page=${currentPage - 1})}">
                Anterior
              </a>
            </li>

            <!-- Números -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
              <a class="page-link"
                 th:text="${i + 1}"
                 th:href="@{/products/search(
                                text=${text},
                                maxPrice=${maxPrice},
                                brandId=${brandId},
                                categoryId=${categoryId},
                                size=${size},
                                sortBy=${sortBy},
                                page=${i})}">
              </a>
            </li>

            <!-- Siguiente -->
            <li class="page-item"
                th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
              <a class="page-link"
                 th:href="@{/products/search(
                                text=${text},
                                maxPrice=${maxPrice},
                                brandId=${brandId},
                                categoryId=${categoryId},
                                size=${size},
                                sortBy=${sortBy},
                                page=${currentPage + 1})}">
                Siguiente
              </a>
            </li>

          </ul>
        </nav>
      </div>

    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: carousel}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: copyright}"></div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
